<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Weengz - Airline Seat Reservation System">
    <title>Login - Weengz</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">
    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary" role="navigation" aria-label="Main navigation">
        <div class="container">
            <a class="navbar-brand" href="index.html" aria-label="Weengz Home">
                <i class="fas fa-plane-departure me-2" aria-hidden="true"></i>
                <span class="font-bold">Weengz</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav" aria-controls="navbarNav" 
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="login.html">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-lg border-0">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <i class="fas fa-user-circle fa-4x text-primary mb-3" aria-hidden="true"></i>
                                <h1 class="h3 mb-3">Welcome Back</h1>
                                <p class="text-muted">Login to your Weengz account</p>
                            </div>

                            <!-- Login Form -->
                            <form id="loginForm" role="form" aria-label="Login form">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-envelope" aria-hidden="true"></i>
                                        </span>
                                        <input type="email" class="form-control" id="email" 
                                               placeholder="Enter your email" required 
                                               aria-required="true"
                                               autocomplete="email">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-lock" aria-hidden="true"></i>
                                        </span>
                                        <input type="password" class="form-control" id="password" 
                                               placeholder="Enter your password" required 
                                               aria-required="true"
                                               autocomplete="current-password">
                                    </div>
                                </div>

                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">
                                        Remember me
                                    </label>
                                </div>

                                <div class="d-grid mb-3">
                                    <button type="submit" class="btn btn-primary btn-lg">
                                        <i class="fas fa-sign-in-alt me-2" aria-hidden="true"></i>
                                        Login
                                    </button>
                                </div>

                                <div class="text-center">
                                    <a href="#" class="text-decoration-none small">Forgot your password?</a>
                                </div>
                            </form>

                            <hr class="my-4">

                            <!-- Social Login -->
                            <div class="text-center mb-3">
                                <p class="text-muted small">Or login with</p>
                                <div class="d-flex gap-2 justify-content-center">
                                    <button type="button" class="btn btn-outline-primary flex-fill" aria-label="Login with Google">
                                        <i class="fab fa-google me-2" aria-hidden="true"></i>
                                        Google
                                    </button>
                                    <button type="button" class="btn btn-outline-primary flex-fill" aria-label="Login with Facebook">
                                        <i class="fab fa-facebook me-2" aria-hidden="true"></i>
                                        Facebook
                                    </button>
                                </div>
                            </div>

                            <!-- Sign Up Link -->
                            <div class="text-center mt-4">
                                <p class="mb-0">Don't have an account? 
                                    <a href="#" class="text-decoration-none fw-bold">Sign up</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5" role="contentinfo">
        <div class="container">
            <div class="text-center small">
                <p>&copy; 2025 Weengz. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>
</html>
